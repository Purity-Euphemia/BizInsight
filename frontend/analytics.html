{% extends "layout_dashboard.html" %}
{% block title %}Analytics - BizInsight{% endblock %}

{% block content %}
<div class="flex-between align-center" style="margin-bottom: 2rem;">
    <div>
        <h1 class="page-title">Business Analytics</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Interactive insights, trends, and breakdowns.</p>
    </div>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
    <!-- Sales Trend Line Chart -->
    <div class="card" style="margin-bottom: 0;">
        <h3 style="margin-bottom: 1.5rem;">30-Day Sales Trend</h3>
        <canvas id="salesTrendChart"></canvas>
    </div>

    <!-- Expense Breakdown Doughnut -->
    <div class="card" style="margin-bottom: 0;">
        <h3 style="margin-bottom: 1.5rem;">Expense Breakdown</h3>
        <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="expenseBreakdownChart"></canvas>
        </div>
    </div>
</div>

<!-- Profit Trend Bar Chart -->
<div class="card">
    <h3 style="margin-bottom: 1.5rem;">Revenue vs Expenses (Monthly)</h3>
    <canvas id="profitTrendChart" style="max-height: 400px;"></canvas>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', fetchAnalytics);
</script>
{% endblock %}
