{% extends "layout_dashboard.html" %}
{% block title %}Expenses - BizInsight{% endblock %}

{% block content %}
<div class="flex-between align-center" style="margin-bottom: 2rem;">
    <div>
        <h1 class="page-title">Expenses</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Track your business spending and overheads.</p>
    </div>
    <button class="btn btn-primary" onclick="openAddExpenseModal()">
        <i class="fa-solid fa-plus"></i> Add Expense
    </button>
</div>

<div class="card">
    <div class="table-container">
        <table class="data-table" id="expensesTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expensesTableBody">
                <tr><td colspan="5" class="text-center text-muted">Loading expenses...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Expense Modal -->
<div id="addExpenseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Expense</h2>
            <span class="close" onclick="closeAddExpenseModal()">&times;</span>
        </div>
        <form id="addExpenseForm">
            <div class="form-group">
                <label class="form-label" for="expenseTitle">Description / Title *</label>
                <input class="form-control" type="text" id="expenseTitle" required placeholder="e.g. Office Rent">
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="expenseAmount">Amount *</label>
                    <input class="form-control" type="number" step="0.01" min="0" id="expenseAmount" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="expenseDate">Date *</label>
                    <input class="form-control" type="date" id="expenseDate" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="expenseCategory">Category</label>
                <select class="form-control" id="expenseCategory">
                    <option value="Rent">Rent</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Payroll">Payroll</option>
                    <option value="Supplies">Supplies</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div id="expenseError" class="alert alert-danger" style="display: none;"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddExpenseModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
