<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizInsight</title>
    <!-- 
      Notice how we link to the static files. 
      Flask handles the '/static/' prefix because we configured it in app.py 
    -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">BizInsight</div>
        <div class="nav-links">
            <a href="{{ url_for('auth.login') }}">Log In</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Welcome to BizInsight</h1>
            <p>Your business intelligence and management platform.</p>
        </header>
        
        <main>
            <div class="card">
                <h2>Phase 1 & 2 Status</h2>
                <p class="status-success">Flask setup and Authentication are ready!</p>
                <p>Register an account to see your new dashboard.</p>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
