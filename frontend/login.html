{% extends "layout_auth.html" %}
{% block title %}Log In - BizInsight{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Enter your details to access your dashboard.</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="post">
        <div class="form-group">
            <label class="form-label" for="username">Username / Email</label>
            <input class="form-control" type="text" name="username" id="username" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Log In</button>
    </form>
    
    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create account</a>
    </div>
</div>
{% endblock %}
