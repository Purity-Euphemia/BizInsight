<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - BizInsight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">BizInsight</div>
        <div class="nav-links">
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('main.products') }}">Products</a>
            <a href="{{ url_for('main.inventory') }}">Inventory</a>
            <a href="{{ url_for('main.sales') }}">Sales</a>
            <a href="{{ url_for('main.customers') }}">Customers</a>
            <a href="{{ url_for('main.expenses') }}">Expenses</a>
            <a href="{{ url_for('main.analytics') }}">Analytics</a>
            <span class="user-greeting">| Hello, {{ g.user['username'] }}</span>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary btn-sm">Log Out</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1000px;">
        <header class="dashboard-header flex-between">
            <div>
                <h1>Products</h1>
                <p>Manage your inventory and pricing.</p>
            </div>
            <button class="btn btn-primary" onclick="openProductModal()">+ Add Product</button>
        </header>

        <div class="card toolbar">
            <input type="text" id="searchInput" placeholder="Search products..." onkeyup="debounceFetchProducts()">
            <input type="text" id="categoryFilter" placeholder="Filter by category..." onkeyup="debounceFetchProducts()">
        </div>

        <div class="card mt-4">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Buying Price</th>
                        <th>Selling Price</th>
                        <th>Quantity</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- Products will be loaded here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
                <span class="close" onclick="closeProductModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="productId">
                    <div id="formError" class="alert alert-error" style="display: none;"></div>
                    
                    <div class="form-group">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category">
                    </div>
                    <div class="form-group flex-row">
                        <div style="flex: 1; margin-right: 1rem;">
                            <label for="buying_price">Buying Price</label>
                            <input type="number" step="0.01" min="0" id="buying_price" required value="0">
                        </div>
                        <div style="flex: 1;">
                            <label for="selling_price">Selling Price</label>
                            <input type="number" step="0.01" min="0" id="selling_price" required value="0">
                        </div>
                    </div>
                    <div class="form-group flex-row">
                        <div style="flex: 1; margin-right: 1rem;">
                            <label for="quantity">Quantity</label>
                            <input type="number" min="0" id="quantity" required value="0">
                        </div>
                        <div style="flex: 1;">
                            <label for="low_stock_limit">Low Stock Alert Limit</label>
                            <input type="number" min="0" id="low_stock_limit" required value="0">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        // Fetch products on page load
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
