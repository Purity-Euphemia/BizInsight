{% extends "layout_dashboard.html" %}
{% block title %}Products - BizInsight{% endblock %}

{% block content %}
<div class="flex-between align-center" style="margin-bottom: 2rem;">
    <div>
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Manage your product catalog, pricing, and details.</p>
    </div>
    <button class="btn btn-primary" onclick="openAddProductModal()">
        <i class="fa-solid fa-plus"></i> Add Product
    </button>
</div>

<div class="toolbar">
    <input type="text" id="productSearch" placeholder="Search products by name or category..." onkeyup="filterProducts()">
</div>

<div class="table-container">
    <table class="data-table" id="productsTable">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Buying Price</th>
                <th>Selling Price</th>
                <th>Current Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productsTableBody">
            <tr><td colspan="6" class="text-center text-muted">Loading products...</td></tr>
        </tbody>
    </table>
</div>

<!-- Add Product Modal -->
<div id="addProductModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Product</h2>
            <span class="close" onclick="closeAddProductModal()">&times;</span>
        </div>
        <form id="addProductForm">
            <div class="form-group">
                <label class="form-label" for="productName">Product Name *</label>
                <input class="form-control" type="text" id="productName" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="productCategory">Category</label>
                <input class="form-control" type="text" id="productCategory" placeholder="e.g. Electronics, Groceries">
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="buyingPrice">Buying Price *</label>
                    <input class="form-control" type="number" step="0.01" min="0" id="buyingPrice" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="sellingPrice">Selling Price *</label>
                    <input class="form-control" type="number" step="0.01" min="0" id="sellingPrice" required>
                </div>
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="initialQuantity">Initial Stock</label>
                    <input class="form-control" type="number" min="0" value="0" id="initialQuantity">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label" for="lowStockLimit">Low Stock Alert Limit</label>
                    <input class="form-control" type="number" min="0" value="5" id="lowStockLimit">
                </div>
            </div>
            <div id="productError" class="alert alert-danger" style="display: none;"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddProductModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Product</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
