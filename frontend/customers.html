{% extends "layout_dashboard.html" %}
{% block title %}Customers - BizInsight{% endblock %}

{% block content %}
<div class="flex-between align-center" style="margin-bottom: 2rem;">
    <div>
        <h1 class="page-title">Customers</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Manage your client relationships.</p>
    </div>
    <button class="btn btn-primary" onclick="openAddCustomerModal()">
        <i class="fa-solid fa-user-plus"></i> Add Customer
    </button>
</div>

<div class="card">
    <div class="table-container">
        <table class="data-table" id="customersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Added Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="customersTableBody">
                <tr><td colspan="5" class="text-center text-muted">Loading customers...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Customer Modal -->
<div id="addCustomerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Customer</h2>
            <span class="close" onclick="closeAddCustomerModal()">&times;</span>
        </div>
        <form id="addCustomerForm">
            <div class="form-group">
                <label class="form-label" for="customerName">Full Name *</label>
                <input class="form-control" type="text" id="customerName" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="customerEmail">Email Address</label>
                <input class="form-control" type="email" id="customerEmail">
            </div>
            <div class="form-group">
                <label class="form-label" for="customerPhone">Phone Number</label>
                <input class="form-control" type="tel" id="customerPhone">
            </div>
            <div class="form-group">
                <label class="form-label" for="customerAddress">Address</label>
                <input class="form-control" type="text" id="customerAddress">
            </div>
            <div id="customerError" class="alert alert-danger" style="display: none;"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddCustomerModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
