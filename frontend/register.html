{% extends "layout_auth.html" %}
{% block title %}Create Account - BizInsight{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Create your account</h1>
        <p>Start managing your business smarter today.</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="post">
        <div class="form-group">
            <label class="form-label" for="username">Username / Email</label>
            <input class="form-control" type="text" name="username" id="username" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" name="password" id="password" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="business_name">Business Name</label>
            <input class="form-control" type="text" name="business_name" id="business_name" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Create Account</button>
    </form>
    
    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </div>
</div>
{% endblock %}
