<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BizInsight{% endblock %}</title>
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <div class="auth-wrapper">
        <!-- Left Side: Deep Navy Branding -->
        <div class="auth-left">
            <a href="{{ url_for('main.index') }}" class="auth-brand"><i class="fa-solid fa-chart-pie"></i> BizInsight</a>
            {% block left_content %}
            {% endblock %}
        </div>
        
        <!-- Right Side: White Form Area -->
        <div class="auth-right">
            <div class="auth-form-container">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category if category != 'error' else 'danger' }}">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                
                {% block right_content %}{% endblock %}
            </div>
        </div>
    </div>

</body>
</html>
